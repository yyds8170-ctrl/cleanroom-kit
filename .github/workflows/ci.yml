name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: 核心单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_core -v
      - name: 禁用词合规自检
        run: bin/crk lint
      - name: 发布前一致性自检
        run: python3 scripts/pre_release_check.py

  cli-smoke:
    name: CLI 冒烟（doctor/init）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bin/crk doctor
      - name: doctor 机器可读输出可解析
        run: bin/crk doctor --json | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['version'] and d['python'] and d['platform'];print('doctor --json OK')"
      - run: bin/crk init demo --dir /tmp/demo --desc "smoke"
      - name: 校验生成项目带许可证
        run: grep -q "PolyForm Noncommercial License 1.0.0" /tmp/demo/LICENSE

  e2e:
    name: 端到端（shot + compare）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: 生成站点并启动静态服务
        run: |
          bin/crk init demo-site --dir /tmp/site
          cd /tmp/site && python -m http.server 8060 &
          sleep 3
      - name: CLI 设备模拟截图
        env:
          CRK_BROWSER: "${{ steps.setup-chrome.outputs.chrome-path }}"
        run: bin/crk shot --url http://127.0.0.1:8060/ --out /tmp/shot.png --width 390 --height 844 --mobile --port 9350
      - name: 像素自对照（应零差异）
        run: bin/crk compare --orig /tmp/shot.png --rebuild /tmp/shot.png
      - name: 差异热图（自对照应无红色）
        run: |
          bin/crk compare --orig /tmp/shot.png --rebuild /tmp/shot.png --diff-out /tmp/diff.png
          python3 -c "import sys;sys.path.insert(0,'.');from crkit import pngio;w,h,c,px=pngio.read_png('/tmp/diff.png');red=sum(1 for i in range(w*h) if px[i*3]==255 and px[i*3+1]==0 and px[i*3+2]==0);assert red==0,red;print('差异热图 OK，红色像素 0')"
      - name: DOM 取证（inspect）
        env:
          CRK_BROWSER: "${{ steps.setup-chrome.outputs.chrome-path }}"
        run: |
          bin/crk inspect --url http://127.0.0.1:8060/ --out /tmp/inspect.json --width 390 --height 844 --mobile --port 9351
          python3 -c "import json;d=json.load(open('/tmp/inspect.json'));assert d['viewport']['width']==390;assert len(d['elements'])>0;print('inspect 端到端 OK，元素',len(d['elements']))"
      - name: 交互动作（act eval）
        env:
          CRK_BROWSER: "${{ steps.setup-chrome.outputs.chrome-path }}"
        run: |
          bin/crk act --url http://127.0.0.1:8060/ --port 9352 --out /tmp/act.json --steps '[{"op":"eval","condition":"document.title"}]'
          python3 -c "import json;d=json.load(open('/tmp/act.json'));assert d['steps'][0]['ok'];print('act 端到端 OK')"
      - name: 状态断言（probe）
        env:
          CRK_BROWSER: "${{ steps.setup-chrome.outputs.chrome-path }}"
        run: |
          printf '%s' '[{"name":"标题可见","selector":"h1","expect":{"visible":true}}]' > /tmp/assert.json
          bin/crk probe --url http://127.0.0.1:8060/ --assertions /tmp/assert.json --out /tmp/probe.json --port 9353
      - name: 单命令闭环（verify）
        env:
          CRK_BROWSER: "${{ steps.setup-chrome.outputs.chrome-path }}"
        run: |
          bin/crk verify --url http://127.0.0.1:8060/ --out /tmp/verify --port 9354
          python3 -c "import json;d=json.load(open('/tmp/verify/report.json'));assert d['overall'] in ('pass','fail');assert d['summary']['total']==6;print('verify 端到端 OK，总体',d['overall'])"
